<style>
:root{--background:#eee9dc;--foreground:#39332d;--card:#f6f1e5;--primary:#a9512c;--primary-glow:#bd6741;--primary-shadow:#78371f;--primary-foreground:#fff7e9;--secondary:#e2d9c7;--muted:#e5ddce;--muted-foreground:#786d60;--border:#39332d;--frame:#39332d;--syn-keyword:#9c4328;--syn-string:#477354;--syn-number:#4f5f9c;--syn-comment:#8a8175;--bevel-light:#ffffff88;--bevel-dark:#39332d24;--shadow-block:#39332d;--rule-red:#c28d8d55;--rule-blue:#8998b044;--shadow-panel:inset 2px 2px 0 var(--bevel-light),inset -2px -2px 0 var(--bevel-dark),4px 4px 0 var(--shadow-block);--font-display:'Pixelify Sans',monospace;--font-pixel:'Silkscreen',monospace;--font-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;border-color:var(--border)}html,body{margin:0;width:100%;height:100%;background:var(--background);color:var(--foreground);font-family:var(--font-mono);-webkit-font-smoothing:antialiased}body{overflow:hidden}button,input,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0}.page{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background-color:var(--background);background-image:repeating-linear-gradient(0deg,transparent 0 39px,var(--rule-red) 39px 41px),repeating-linear-gradient(90deg,transparent 0 39px,var(--rule-blue) 39px 40px)}.topbar{height:56px;flex-shrink:0;border-bottom:2px solid var(--border);background:var(--card)}.topinner{height:100%;max-width:1152px;padding:0 24px;margin:auto;display:flex;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;font:26px var(--font-display)}.brand svg{height:29px;width:auto}.nav{margin-left:auto;display:flex;gap:4px}.panel{background:var(--card);border:2px solid var(--border);box-shadow:var(--shadow-panel);min-width:0}.panel-head{height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:2px solid var(--border);background:var(--muted);font:11px var(--font-pixel);letter-spacing:.06em;text-transform:lowercase}.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;background:var(--primary)}.dots i:nth-child(2){background:var(--frame)}.dots i:nth-child(3){background:var(--primary-shadow)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font:11px var(--font-pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--foreground);background:var(--card);border:2px solid var(--shadow-block);box-shadow:inset 2px 2px 0 var(--bevel-light),inset -2px -3px 0 var(--bevel-dark);transition:.12s}.btn:hover{color:var(--primary);outline:2px solid var(--primary);outline-offset:-4px}.btn.primary{color:var(--primary-foreground);background:var(--primary);box-shadow:inset 2px 2px 0 var(--primary-glow),inset -2px -3px 0 var(--primary-shadow)}.btn.primary:hover{background:var(--primary-glow);color:white}.ghost{height:32px;padding:0 12px;border:2px solid transparent;background:transparent;color:var(--muted-foreground);font:11px var(--font-pixel);text-transform:uppercase}.ghost:hover{color:var(--primary);border-color:var(--border);background:var(--secondary)}.pixel{font:10px var(--font-pixel);letter-spacing:.12em;text-transform:uppercase}.field{width:100%;padding:10px 12px;color:var(--foreground);background:var(--card);border:2px solid var(--border);box-shadow:inset 2px 2px 0 var(--bevel-dark);outline:none;font:14px var(--font-mono)}.field:focus{border-color:var(--primary);box-shadow:inset 2px 2px 0 var(--bevel-dark),3px 3px 0 var(--primary)}.muted{color:var(--muted-foreground)}.page-main{width:100%;max-width:1152px;margin:0 auto;padding:24px;min-height:0;flex:1}.signup-main{display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.signup{width:100%;max-width:440px;padding:24px}.signup form{display:grid;gap:16px}.signup-title{display:flex;align-items:center;gap:16px;font-size:30px}.signup-title svg{height:40px}.label{display:block;margin-bottom:6px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor-main{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);gap:16px}.toolbar{grid-column:span 12;display:flex;align-items:center;gap:4px;padding:8px;position:relative;z-index:10}.toolbar .push{margin-left:auto}.editor-panel{grid-column:span 8;display:flex;flex-direction:column;min-height:0}.output-panel{grid-column:span 4;display:flex;flex-direction:column;min-height:0}.filehead{height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:2px solid var(--border);background:var(--muted);font:11px var(--font-pixel)}.filehead input{min-width:0;flex:1;border:0;background:transparent;outline:0;color:var(--foreground);font:14px var(--font-mono)}.codearea{display:flex;flex:1;min-height:0;overflow:auto;background:var(--background);font:14px/24px var(--font-mono)}.linenums{padding:16px 12px;text-align:right;white-space:pre;color:var(--syn-comment);background:var(--card);border-right:2px solid var(--border);user-select:none}.codewrap{position:relative;flex:1;min-width:0}.codewrap textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:var(--foreground);padding:16px;white-space:pre;overflow:auto;tab-size:2;font:14px/24px var(--font-mono)}.output{padding:12px;overflow:auto;flex:1;background:var(--background);font:13px/24px var(--font-mono);white-space:pre-wrap}.outline{color:var(--primary)}.err{color:#a52f28;border-left:2px solid #a52f28;padding-left:12px}.home-main{overflow:auto}.home-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);gap:16px;height:100%}.greeting{grid-column:span 12;display:flex;align-items:center;gap:12px;padding:12px 20px}.greeting h1{font-size:30px;margin-right:auto}.projects{grid-column:span 8;overflow:auto}.cheats{grid-column:span 4;overflow:auto;padding:16px}.project-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:2px solid #39332d20}.project-row:hover{background:var(--secondary)}.project-row .square{height:12px;width:12px;background:var(--primary-shadow)}.project-row span:nth-child(2){font-size:13px}.project-row small{margin-left:auto;color:var(--muted-foreground)}.cheat{border-left:2px solid var(--primary);background:var(--background);padding:10px 12px;margin-bottom:8px}.cheat code{display:block;font-size:13px}.chatdock{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:12px}.botbutton{width:56px;height:56px;padding:6px;position:relative;animation:bob 2s steps(2,jump-none) infinite}.botbutton svg{width:100%;height:100%}.botbutton:after{content:'';position:absolute;right:-4px;top:-4px;width:12px;height:12px;background:var(--primary);animation:blink 1s steps(1) infinite}.chatbox{width:min(360px,calc(100vw - 32px));height:min(460px,calc(100dvh - 96px));display:flex;flex-direction:column;animation:slide .2s steps(4,end)}.chatmessages{flex:1;overflow:auto;padding:12px;background:var(--background);display:flex;flex-direction:column;gap:12px;font-size:13px;white-space:pre-wrap}.msg{max-width:88%;padding:8px 12px;border:2px solid var(--border);background:var(--card)}.msg.you{margin-left:auto;border-color:var(--primary);background:var(--secondary)}.chatchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:2px solid var(--border)}.chip{font:10px var(--font-mono);padding:5px 7px;border:2px solid var(--border);background:var(--secondary);color:var(--muted-foreground)}.chatform{display:flex;gap:8px;padding:8px;border-top:2px solid var(--border)}.chatform input[type=text]{min-width:0;flex:1;padding:8px;border:2px solid var(--border);background:var(--card);font:12px var(--font-mono)}.hidden{display:none!important}.status{font-size:12px;color:var(--primary)}.preview-wrap{height:160px;border-top:2px solid var(--border);background:white}.preview-wrap iframe{width:100%;height:100%;border:0;background:white}@keyframes blink{50%{opacity:0}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){.topinner{padding:0 12px}.topbar{height:52px}.brand{font-size:22px}.nav .ghost:last-child{display:none}.page-main{padding:12px}.editor-main{grid-template-columns:1fr;grid-template-rows:auto minmax(260px,1fr) minmax(130px,.6fr);gap:12px}.toolbar,.editor-panel,.output-panel{grid-column:1}.editor-panel{grid-row:2}.output-panel{grid-row:3}.home-grid{grid-template-columns:1fr;grid-template-rows:auto minmax(180px,1fr) auto}.greeting,.projects,.cheats{grid-column:1}.greeting h1{font-size:23px}.greeting{flex-wrap:wrap}.projects{grid-row:2}.cheats{grid-row:3}.toolbar{flex-wrap:wrap}.toolbar .push{margin-left:auto}.preview-wrap{height:120px}}
</style></head>
<body><div id="app"></div>
<script>
const FLUX_GRID=["###############.","#bbbbbbbbbbbbb#s","#bCbcbcbbbbbbb#s","###############s","#bbbbbbbbbbbbb#s","#bCCbbbbbbbbbb#s","#bbCCbbbbbbbbb#s","#bbbCCbbbbbbbb#s","#bbCCbbbbbbbbb#s","#bCCbbbCCCCCbb#s","#bbbbbbbbbbbbb#s","###############s",".sssssssssssssss"];
const XBOT_GRID=["..................C.....",".......##########.#.....",".....##CCCCCCCCCC##.....","....#..............#....","...#................#...","..#..................#..",".#..###############...#.",".#..#bbbbbbbbbbbbb#s..#.",".#..#bCbcbcbbbbbbb#s..#.","###.###############s.###","#C#.#bbbbbbbbbbbbb#s.#C#","#C#.#bCCbbbbbbbbbb#s.#C#","#C#.#bbCCbbbbbbbbb#s.#C#","#C#.#bbbCCbbbbbbbb#s.#C#","###.#bbCCbbbbbbbbb#s.###","....#bCCbbbCCCCCbb#s....","....#bbbbbbbbbbbbb#s....","....###############s....",".....sssssssssssssss...."];
const palette={'#':'var(--frame)','b':'var(--card)','C':'var(--primary)','c':'var(--accent)','s':'var(--primary-shadow)'};
function mark(grid,label,cls=''){let w=Math.max(...grid.map(x=>x.length));return `<svg class="${cls}" viewBox="0 0 ${w} ${grid.length}" role="img" aria-label="${label}" shape-rendering="crispEdges">${grid.map((row,y)=>[...row].map((ch,x)=>palette[ch]?`<rect x="${x}" y="${y}" width="1" height="1" fill="${palette[ch]}"/>`: '').join('')).join('')}</svg>`}
const SAMPLE=`# hello.flux — your first Flux program\nlet name = "World"\nlet year = 2026\n\nsay "Hello, " + name + "!"\nsay "Flux turns " + (year - 2025) + " this year"\n`;
const KEY='flux-files', USER='flux-user';let route='/',code=SAMPLE,fileName='untitled.flux',result=null,menu=null,lineNums=true,chatOpen=false,chatMsgs=[{from:'bot',text:"Hi, I'm Xbot. Ask me about Flux, or attach a file."}],pendingFile=null,generatedFiles=[];
function files(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').sort((a,b)=>b.updatedAt-a.updatedAt)}catch{return[]}}
function save(name,code){let f=files().filter(x=>x.name!==name);f.push({name,code,updatedAt:Date.now()});localStorage.setItem(KEY,JSON.stringify(f))}
function getFile(n){return files().find(f=>f.name===n)}function getUser(){try{return JSON.parse(localStorage.getItem(USER)||'null')}catch{return null}}
function nav(r,filename){route=r;if(filename){fileName=filename;let f=getFile(filename);code=f?f.code:`# ${filename}\nsay "Hello from ${filename}"\n`;result=null}render()}
function topbar(){return `<header class="topbar"><div class="topinner"><a class="brand" href="#" onclick="nav('/home');return false">${mark(FLUX_GRID,'Flux logo')}<span>flux</span></a><nav class="nav"><button class="ghost" onclick="nav('/home')">Home</button><button class="ghost" onclick="nav('/editor')">Editor</button><button class="ghost" onclick="nav('/')">Sign up</button></nav></div></header>`}
function panelHead(t,meta=''){return `<div class="panel-head"><span class="dots"><i></i><i></i><i></i></span><span>${t}</span>${meta?`<span style="margin-left:auto">${meta}</span>`:''}</div>`}
function signup(){let u=getUser();return `<div class="page">${topbar()}<main class="signup-main"><section class="panel signup"><form onsubmit="signupSubmit(event)"><div class="signup-title">${mark(FLUX_GRID,'Flux logo')}<h1>Join Flux</h1></div>${u?`<button class="btn" type="button" onclick="nav('/home')">Continue as ${esc(u.name)} →</button>`:''}<label><span class="pixel muted label">Name</span><input id="signupName" class="field" required></label><label><span class="pixel muted label">Email</span><input id="signupEmail" type="email" class="field" required></label><label><span class="pixel muted label">Password</span><input id="signupPw" type="password" class="field" required></label><p id="signupErr" class="status"></p><div class="twocol"><button class="btn" type="button" onclick="nav('/home')">Skip</button><button class="btn primary">Create</button></div><p class="pixel muted" style="text-align:center">Built by Xtink</p></form></section></main></div>`}
function home(){let fs=files(),u=getUser();let rows=fs.length?fs.map(f=>`<div class="project-row"><span class="square"></span><a style="flex:1;min-width:0" href="#" onclick="nav('/editor',${JSON.stringify(f.name)});return false">${esc(f.name)}</a><small>${new Date(f.updatedAt).toLocaleDateString()}</small><button class="ghost" onclick="deleteProject('${esc(f.name)}')">×</button></div>`).join(''):['hello.flux','math.flux','story.flux'].map(n=>`<div class="project-row"><span class="square"></span><a style="flex:1" href="#" onclick="nav('/editor','${n}');return false">${n}</a><small>template</small></div>`).join('');return `<div class="page">${topbar()}<main class="page-main home-main"><div class="home-grid"><div class="panel greeting"><h1>Hi, ${esc(u?.name||'coder')}!</h1><span id="homeStatus" class="status"></span><input id="uploadHome" type="file" multiple accept=".flux,.txt,.md,text/plain" hidden onchange="uploadHomeFiles(this.files)"><button class="btn" onclick="document.getElementById('uploadHome').click()">↑ Upload</button><button class="btn primary" onclick="nav('/editor')">+ New file</button></div><section class="panel projects">${panelHead('projects',fs.length||'templates')}${rows}</section><section class="panel cheats">${panelHead('cheat sheet')}<div class="cheat"><code>let x = 5</code><span class="pixel muted">store</span></div><div class="cheat"><code>say "hi " + x</code><span class="pixel muted">print</span></div><div class="cheat"><code># note</code><span class="pixel muted">comment</span></div></section></div></main></div>`}
function editor(){let lines=code.split('\n');return `<div class="page">${topbar()}<main class="page-main editor-main"><div class="panel toolbar"><div style="position:relative"><button class="ghost" onclick="toggleMenu('file')">File</button><div id="fileMenu" class="panel hidden" style="position:absolute;top:36px;left:0;width:220px;padding:8px;z-index:20"><button class="ghost" style="display:block;width:100%;text-align:left" onclick="newFile()">New file</button>${files().map(f=>`<button class="ghost" style="display:block;width:100%;text-align:left" onclick="openFile('${esc(f.name)}')">${esc(f.name)}</button>`).join('')}</div></div><div style="position:relative"><button class="ghost" onclick="toggleMenu('view')">View</button><div id="viewMenu" class="panel hidden" style="position:absolute;top:36px;left:0;width:190px;padding:8px;z-index:20"><button class="ghost" style="display:block" onclick="lineNums=!lineNums;render()">${lineNums?'Hide':'Show'} line numbers</button><button class="ghost" style="display:block" onclick="result=null;render()">Clear output</button></div></div><button class="ghost" onclick="doSave()">Save</button><span id="saveMsg" class="status"></span><button class="btn primary push" onclick="runCode()">▶ Run</button><button class="btn" onclick="buildFlux()">Build</button></div><section class="panel editor-panel"><div class="filehead"><span class="dots"><i></i><i></i><i></i></span><input value="${esc(fileName)}" onchange="fileName=this.value"><span>${lines.length} ln</span></div><div class="codearea">${lineNums?`<div class="linenums">${lines.map((_,i)=>i+1).join('\n')}</div>`:''}<div class="codewrap"><textarea id="codeInput" spellcheck="false" aria-label="Code editor" oninput="code=this.value;updateLineCount()">${esc(code)}</textarea></div></div></section><section class="panel output-panel">${panelHead('output',result?.error?'error':result?'ok':'')}<div id="output" class="output">${result?result.output.map(x=>`<div><span class="outline">&gt;</span> ${esc(x)}</div>`).join('')+(result.error?`<p class="err">! ${esc(result.error)}</p>`:''):'<span class="muted">&gt; press Run<span class="outline">_</span></span>'}</div><div class="preview-wrap"><iframe id="preview" title="Build preview" sandbox="allow-scripts"></iframe></div></section></main></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('app').innerHTML=(route==='/'?signup():route==='/home'?home():editor())+chatDock();if(route==='/editor'){let p=document.getElementById('preview');if(p)p.srcdoc='<body style="font:14px monospace;padding:12px;color:#777">Build preview will appear here.</body>'}}
function signupSubmit(e){e.preventDefault();let name=document.getElementById('signupName').value.trim(),email=document.getElementById('signupEmail').value,pw=document.getElementById('signupPw').value;if(!name){document.getElementById('signupErr').textContent='Tell us your name.';return}if(!/^\S+@\S+\.\S+$/.test(email)){document.getElementById('signupErr').textContent="That email doesn't look right.";return}if(pw.length<6){document.getElementById('signupErr').textContent='Password needs at least 6 characters.';return}localStorage.setItem(USER,JSON.stringify({name,email}));nav('/home')}
function deleteProject(n){save(n,'');localStorage.setItem(KEY,JSON.stringify(files().filter(f=>f.name!==n)));render()}
function newFile(){fileName='untitled.flux';code='';result=null;render()}function openFile(n){nav('/editor',n)}function doSave(){save(fileName,code);let s=document.getElementById('saveMsg');if(s){s.textContent='saved ✓';setTimeout(()=>{if(s)s.textContent=''},1500)}}function updateLineCount(){}
function toggleMenu(which){let id=which==='file'?'fileMenu':'viewMenu';document.getElementById(id)?.classList.toggle('hidden')}
function runFlux(src){let vars=new Map(),out=[],lines=src.split('\n');function tokens(s){let a=[],i=0;while(i<s.length){let c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;a.push({t:'num',v:s.slice(i,j)});i=j;continue}if(c==='"'){let j=s.indexOf('"',i+1);if(j<0)throw Error('String is missing its closing quote');a.push({t:'str',v:s.slice(i+1,j)});i=j+1;continue}if(/[A-Za-z_]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z0-9_]/.test(s[j]))j++;a.push({t:'id',v:s.slice(i,j)});i=j;continue}if('+-*/()'.includes(c)){a.push({t:'op',v:c});i++;continue}throw Error(`Unexpected character "${c}"`)}return a}function evalx(s){let t=tokens(s),p=0,peek=()=>t[p],num=v=>{if(typeof v!=='number')throw Error(`"${v}" is not a number`);return v};function factor(){let x=t[p++];if(!x)throw Error('Expression ended too early');if(x.t==='num')return Number(x.v);if(x.t==='str')return x.v;if(x.t==='id'){if(!vars.has(x.v))throw Error(`"${x.v}" is not defined`);return vars.get(x.v)}if(x.v==='('){let v=expr();if(t[p++]?.v!==')')throw Error('Missing )');return v}if(x.v==='-')return -num(factor());throw Error(`Unexpected "${x.v}"`)}function term(){let l=factor();while(peek()?.t==='op'&&['*','/'].includes(peek().v)){let op=t[p++].v,r=factor();if(op==='/'&&num(r)===0)throw Error('Cannot divide by zero');l=op==='*'?num(l)*num(r):num(l)/num(r)}return l}function expr(){let l=term();while(peek()?.t==='op'&&['+','-'].includes(peek().v)){let op=t[p++].v,r=term();l=op==='+'&&(typeof l==='string'||typeof r==='string')?`${l}${r}`:op==='+'?l+r:num(l)-num(r)}return l}let v=expr();if(p<t.length)throw Error(`Unexpected "${t[p].v}"`);return v}for(let i=0;i<lines.length;i++){let l=lines[i].trim();if(!l||l.startsWith('#'))continue;try{let m=/^let\s+([A-Za-z_]\w*)\s*=\s*(.+)$/.exec(l);if(m){vars.set(m[1],evalx(m[2]));continue}m=/^say\s+(.+)$/.exec(l);if(m){out.push(String(evalx(m[1])));continue}throw Error('Lines must start with let or say')}catch(e){return{output:out,error:`Line ${i+1}: ${e.message}`}}}return{output:out,error:null}}
function runCode(){code=document.getElementById('codeInput')?.value??code;result=runFlux(code);render()}
async function buildFlux(){code=document.getElementById('codeInput')?.value??code;doSave();let out=document.getElementById('output');if(out)out.textContent='Xbot is building your FLUX project…';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'build',message:'Build the supplied FLUX program into a complete working web project. Return complete files.',flux:code,active_file:fileName,history:[],context:{}})});if(!r.ok)throw Error(`Build request failed (${r.status}). Check that the FLUX backend is connected.`);let data=await r.json();generatedFiles=Array.isArray(data.files)?data.files:Object.entries(data.files||{}).map(([path,content])=>({path,content}));if(!generatedFiles.length)throw Error(data.reply||'Xbot did not return any project files.');let p=document.getElementById('preview');let html=generatedFiles.find(f=>/\.html?$/i.test(f.path));if(p&&html)p.srcdoc=html.content;out=document.getElementById('output');if(out)out.innerHTML=`<p class="outline">✓ Build complete</p><p>${generatedFiles.length} file(s) generated.</p><button class="btn primary" onclick="downloadZip()">Download project ZIP</button><p>${esc(data.reply||'Your project is ready.')}</p>`; }catch(e){out=document.getElementById('output');if(out)out.textContent=e.message}}
async function downloadZip(){if(!window.JSZip){alert('ZIP library could not load.');return}let zip=new JSZip();generatedFiles.forEach(f=>zip.file(f.path,f.content));zip.file(fileName,code);let blob=await zip.generateAsync({type:'blob'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flux-build.zip';a.click();URL.revokeObjectURL(a.href)}
function chatDock(){return `<div class="chatdock">${chatOpen?`<section class="panel chatbox"> <div class="panel-head">${mark(XBOT_GRID,'Xbot logo','')}<span style="color:var(--primary)">xbot</span><button class="ghost" style="margin-left:auto" onclick="chatOpen=false;render()">✕</button></div><div id="chatMessages" class="chatmessages">${chatMsgs.map(m=>`<div class="msg ${m.from==='you'?'you':''}">${esc(m.text)}</div>`).join('')}</div><div class="chatchips">${['How do I print?','Make a variable','Fix an error'].map(x=>`<button class="chip" onclick="sendChat(${JSON.stringify(x)})">${x}</button>`).join('')}</div><div id="pendingLabel" class="muted" style="padding:4px 10px;font-size:11px">${pendingFile?esc(pendingFile.name):''}</div><form class="chatform" onsubmit="event.preventDefault();sendChat(document.getElementById('chatInput').value)"><input id="chatFile" type="file" hidden onchange="pendingFile=this.files[0];document.getElementById('pendingLabel').textContent=pendingFile.name"><button class="btn" type="button" style="padding:6px 10px" onclick="document.getElementById('chatFile').click()">＋</button><input id="chatInput" type="text" placeholder="Ask Xbot…"><button class="btn primary" style="padding:6px 12px">Send</button></form></section>`:''}<button class="panel botbutton" onclick="chatOpen=!chatOpen;render()" aria-label="Open Xbot">${mark(XBOT_GRID,'Xbot')}</button></div>`}
async function sendChat(text){let f=pendingFile;if(!text.trim()&&!f)return;chatMsgs.push({from:'you',text:text||`Attached ${f.name}`});pendingFile=null;render();let answer='';try{let body={action:'chat',message:text,flux:code,active_file:fileName,history:chatMsgs.slice(-8)};if(f){if(f.size>200000)throw Error('File too large (max 200 KB)');body.attachment={name:f.name,content:await f.text()}}let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){let d=await r.json();answer=d.reply||'I could not form a reply.'}else throw Error('Xbot backend is not connected yet.')}catch(e){answer=e.message==='Xbot backend is not connected yet.'?e.message:(/Failed to fetch/.test(e.message)?'Connect the FLUX backend to enable Xbot AI.':e.message)}chatMsgs.push({from:'bot',text:answer});render()}
async function uploadHomeFiles(list){let ok=0;for(let f of list){if(f.size>200000)continue;let txt=await f.text(),n=/\.flux$/i.test(f.name)?f.name:f.name.replace(/\.[^.]+$/,'')+'.flux';save(n,txt);ok++}render()}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(route==='/editor')doSave()}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(route==='/editor')runCode()}});render();
</script></body></html>
